<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>iPhone Style Camera</title>
<style>
html, body {
  margin:0; padding:0;
  height:100%; width:100%;
  background:#000; overflow:hidden;
  font-family:'Sarabun', Tahoma, sans-serif;
  height: -webkit-fill-available;
}

/* วิดีโอเต็มจอ */
#video {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  object-fit:cover;
}
#canvas { display:none; }

/* เส้น Grid 3x3 */
#grid {
  position:absolute;
  top:0; left:0; width:100%; height:100%;
  pointer-events:none;
  display:grid;
  grid-template-rows: 1fr 1fr 1fr;
  grid-template-columns: 1fr 1fr 1fr;
}
#grid div { border:1px solid rgba(255,255,255,0.3); }

/* ปุ่มด้านบน */
.top-controls {
  position:absolute;
  top:2vh;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  color:white;
  font-size:4vw;
  z-index:10;
}

/* ปุ่มด้านล่าง */
.bottom-controls {
  position:absolute;
  bottom:3vh;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5vw;
  z-index:10;
}

/* ปุ่มถ่ายรูปใหญ่กว่าปุ่มอื่น */
#captureBtn {
  width:12vw; height:12vw;
  border-radius:50%;
  background:white;
  border:0.5vw solid #ddd;
}

/* ปุ่มกลมเล็ก */
button {
  width:8vw; height:8vw;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.2);
  color:white;
  font-size:4vw;
}

/* แถบโหมด เหลือแค่ รูปภาพ */
.mode-bar {
  position:absolute;
  bottom:15vh;
  width:100%;
  display:flex;
  justify-content:center;
  font-size:4vw;
  color:white;
  z-index:10;
}
.mode-bar span.active {
  color:yellow;
}
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="grid">
  <div></div><div></div><div></div>
  <div></div><div></div><div></div>
  <div></div><div></div><div></div>
</div>

<!-- ปุ่มด้านบน -->
<div class="top-controls">
  <button id="torchBtn">🔦</button>
  <button>☰</button>
  <button>⚙️</button>
</div>

<!-- แถบโหมด เหลือแค่ รูปภาพ -->
<div class="mode-bar">
  <span class="active">รูปภาพ</span>
</div>

<!-- ปุ่มด้านล่าง -->
<div class="bottom-controls">
  <button id="switchBtn">🔄</button>
  <button id="captureBtn"></button>
  <button>🖼️</button>
</div>

<script>
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let stream, track, usingFrontCamera = false, torchOn = false;

// เปิดกล้อง
async function initCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:usingFrontCamera?'user':'environment'}
    });
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
  }catch(err){
    alert("ไม่สามารถเปิดกล้องได้: "+err.message);
  }
}
initCamera();

// ปุ่มสลับกล้อง
document.getElementById('switchBtn').addEventListener('click', async ()=>{
  usingFrontCamera = !usingFrontCamera;
  await initCamera();
});

// ปุ่มแฟลช
document.getElementById('torchBtn').addEventListener('click', async ()=>{
  if(track.getCapabilities().torch){
    torchOn = !torchOn;
    await track.applyConstraints({advanced:[{torch:torchOn}]});
  }else alert("อุปกรณ์ไม่รองรับแฟลช");
});

// ปุ่มถ่ายรูป
document.getElementById('captureBtn').addEventListener('click', ()=>{
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  canvas.toBlob(blob=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `photo_${Date.now()}.jpg`;
    a.click();
  }, 'image/jpeg', 0.9);
});
</script>
</body>
</html>
